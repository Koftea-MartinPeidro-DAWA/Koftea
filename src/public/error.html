<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/logo.ico">
    <title>KoffTea</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            color: #555;
            gap: 1rem;
        }

        p {
            font-size: 1rem;
            letter-spacing: .02em;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid #e8ddd0;
            border-top-color: #8b5e3c;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .dot {
            display: inline-block;
            animation: blink 1.4s infinite;
        }
        .dot:nth-child(2) { animation-delay: .2s; }
        .dot:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40%            { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>El servidor se está actualizando, vuelve en unos instantes</p>
    <button onclick="window.location.reload()" style="margin-top:.5rem;padding:.6rem 1.4rem;background:#2e2e2c;color:#f4ecd8;border:none;border-radius:8px;font-family:Georgia,serif;font-size:.9rem;cursor:pointer;">
        Volver a intentar
    </button>
</body>
</html>
